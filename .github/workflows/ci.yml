name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: zcc

      - name: Install native deps
        # zz build shells out to clang and links -lsqlite3 for the native
        # backend; runner images don't guarantee the headers.
        run: sudo apt-get update -q && sudo apt-get install -y -q clang libcurl4-openssl-dev libsqlite3-dev unzip

      - name: Install prebuilt zz toolchain
        # Built once per zz release upstream — never compiled here.
        # Always tracks the latest zz release.
        run: |
          ZZVER=$(curl -fsSL https://api.github.com/repos/zaidejjo/zz/releases/latest | grep -o '"tag_name": *"v[^"]*"' | head -n 1 | sed 's/.*"v//;s/"//')
          test -n "$ZZVER"
          echo "zz toolchain version: $ZZVER"
          curl -fsSL "https://github.com/zaidejjo/zz/releases/download/v$ZZVER/zz-$ZZVER-linux-x86_64.zip" \
            -o /tmp/zz.zip
          mkdir -p "$HOME/.local/zz-toolchain"
          unzip -o -q /tmp/zz.zip -d "$HOME/.local/zz-toolchain"
          "$HOME/.local/zz-toolchain/zz" --version
          echo "$HOME/.local/zz-toolchain" >> "$GITHUB_PATH"

      - name: Install ZZ dependencies
        working-directory: zcc
        run: zz install

      - name: zz test
        working-directory: zcc
        run: zz test

      - name: Release build
        working-directory: zcc
        run: zz build -p src/main.zz

      - name: Smoke test
        working-directory: zcc
        run: |
          ./bin/zcc --no-cache . --output json | tee /tmp/zcc-smoke.json | grep -Eq '"total"[[:space:]]*:[[:space:]]*\{[^}]*"files"[[:space:]]*:[[:space:]]*[1-9]'
          ./bin/zcc --version
          ./bin/zcc init --help 2>/dev/null || ./bin/zcc --help | head -n 5
