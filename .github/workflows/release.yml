name: release

# Cut a release by pushing a tag: `git tag v0.2.0 && git push origin v0.2.0`.
# Tags the current main tree; version stamping happens from the tag name.
#
# Two jobs, strict order:
#   build — prebuilt zz toolchain (pinned in packaging/zz.version), zz test,
#           native release build, binary + source tarballs uploaded to the
#           GitHub Release.
#   aur   — Arch container: render the PKGBUILD from its template, generate
#           .SRCINFO with makepkg, push to the `zcc` AUR repo over SSH
#           (first push creates the package). Plain steps, pinned host keys —
#           see packaging/aur/aur_known_hosts.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: zcc

      - name: Install native deps
        run: sudo apt-get update -q && sudo apt-get install -y -q clang libcurl4-openssl-dev libsqlite3-dev unzip

      - name: Install prebuilt zz toolchain
        # Built once per zz release upstream — never compiled here.
        run: |
          ZZVER=$(tr -d '[:space:]' < zcc/packaging/zz.version)
          test -n "$ZZVER"
          curl -fsSL "https://github.com/zaidejjo/zz/releases/download/v$ZZVER/zz-$ZZVER-linux-x86_64.zip" \
            -o /tmp/zz.zip
          mkdir -p "$HOME/.local/zz-toolchain"
          unzip -o -q /tmp/zz.zip -d "$HOME/.local/zz-toolchain"
          "$HOME/.local/zz-toolchain/zz" --version
          echo "ZZVER=$ZZVER" >> "$GITHUB_ENV"
          echo "$HOME/.local/zz-toolchain" >> "$GITHUB_PATH"

      - name: Stamp version from tag
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          sed -i "s/^    \"0\.1\.0\"$/    \"$VERSION\"/" zcc/src/main.zz
          sed -i "s/^version = \"0\.1\.0\"$/version = \"$VERSION\"/" zcc/zz.toml
          grep -n "\"$VERSION\"" zcc/src/main.zz zcc/zz.toml

      - name: Checkout zz workspace (native runtime link)
        # Same as ci.yml: the 0.2.0+ toolchain needs the Rust workspace
        # at native-link time (see ZZ_NATIVE_RT_DIR below).
        run: |
          ZZVER=$(tr -d '[:space:]' < zcc/packaging/zz.version)
          git clone --depth 1 --branch "v$ZZVER" https://github.com/zaidejjo/zz.git zz-src

      - name: Test + release build
        working-directory: zcc
        env:
          ZZ_NATIVE_RT_DIR: ${{ github.workspace }}/zz-src
        run: |
          zz test
          zz build -p src/main.zz
          ./src/bin/main --no-cache . --output json | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['total'])"

      - name: Package artifacts
        run: |
          cd zcc
          mkdir -p dist "zcc-$VERSION"
          cp src/bin/main "zcc-$VERSION/zcc"
          cp README.md LICENSE config.example.json config.example-zz.json "zcc-$VERSION/"
          tar -czf "dist/zcc-$VERSION-linux-x86_64.tar.gz" -C "zcc-$VERSION" .
          git archive --format=tar.gz --prefix="zcc-$VERSION/" -o "dist/zcc-$VERSION-src.tar.gz" HEAD
          # NOTE: git archive captures the *tag* tree (unstamped version);
          # the stamped files above go only into the binary tarball.
          # The AUR PKGBUILD re-stamps via its own sed; see packaging/aur.
          cd dist && sha256sum ./*.tar.gz > sha256sums.txt && cat sha256sums.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd zcc/dist
          gh release create "${{ github.ref_name }}" \
            --title "zcc ${{ env.VERSION }}" \
            --generate-notes \
            "zcc-${{ env.VERSION }}-linux-x86_64.tar.gz" \
            "zcc-${{ env.VERSION }}-src.tar.gz" \
            sha256sums.txt

      - name: Upload source tarball for AUR job
        uses: actions/upload-artifact@v4
        with:
          name: src-tarball
          path: |
            zcc/dist/zcc-${{ env.VERSION }}-src.tar.gz
            zcc/dist/sha256sums.txt

  aur:
    needs: build
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
        with:
          path: zcc
          ref: ${{ github.ref }}

      - name: Install tools
        run: |
          pacman -Syu --noconfirm git openssh namcap >/dev/null 2>&1
          useradd -m builder 2>/dev/null || true
          git config --global --add safe.directory '*'
          git config --global user.name "zcc-ci"
          git config --global user.email "zcc-ci@users.noreply.github.com"

      - name: Fetch source tarball hash
        uses: actions/download-artifact@v4
        with:
          name: src-tarball
          path: /tmp/artifacts

      - name: Render PKGBUILD + SRCINFO
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          SHA=$(awk "/zcc-$VERSION-src.tar.gz/ {print \$1}" /tmp/artifacts/sha256sums.txt)
          ZZVER=$(tr -d '[:space:]' < zcc/packaging/zz.version)
          test -n "$SHA" && test -n "$ZZVER"
          # Hash the pinned prebuilt toolchain zip (same URL the PKGBUILD uses).
          curl -fsSL "https://github.com/zaidejjo/zz/releases/download/v$ZZVER/zz-$ZZVER-linux-x86_64.zip" \
            -o /tmp/zz-toolchain.zip
          ZZSHA=$(sha256sum /tmp/zz-toolchain.zip | cut -d' ' -f1)
          mkdir -p aurpkg
          sed -e "s/@PKGVER@/$VERSION/g" -e "s/@SHA256@/$SHA/g" \
              -e "s/@ZZVER@/$ZZVER/g" -e "s/@ZZSHA@/$ZZSHA/g" \
            zcc/packaging/aur/PKGBUILD.template > aurpkg/PKGBUILD
          rm -rf /tmp/buildpkg && mkdir -p /tmp/buildpkg
          cp aurpkg/PKGBUILD /tmp/buildpkg/PKGBUILD
          chown -R builder:builder /tmp/buildpkg
          su builder -c "cd /tmp/buildpkg && makepkg --printsrcinfo > .SRCINFO"
          cp /tmp/buildpkg/.SRCINFO aurpkg/.SRCINFO
          cat aurpkg/PKGBUILD
          echo "--- namcap ---"
          su builder -c "cd /tmp/buildpkg && namcap PKGBUILD" || true

      - name: Setup AUR ssh
        run: |
          # GitHub pins HOME=/github/home in containers but OpenSSH resolves
          # ~ via getpwuid (/root) — without this, shell and ssh use two
          # different homes and ssh never finds known_hosts ("Host key
          # verification failed" with correct keys in the file).
          export HOME=/root
          if [ -z "${AUR_SSH_PRIVATE_KEY:-}" ]; then
            echo "error: secret AUR_SSH_PRIVATE_KEY is not set." >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          # Host keys pinned in-repo (no keyscan to flake). ssh-keygen -F
          # validates real entries — a grep would match `#` comment lines.
          cp zcc/packaging/aur/aur_known_hosts ~/.ssh/known_hosts
          if ! ssh-keygen -F aur.archlinux.org -f ~/.ssh/known_hosts >/dev/null 2>&1; then
            echo "error: pinned known_hosts has no aur.archlinux.org entry." >&2
            exit 1
          fi
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -lf ~/.ssh/known_hosts
          printf 'Host aur.archlinux.org\n  User aur\n  IdentityFile ~/.ssh/aur\n  IdentitiesOnly yes\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config
          echo "--- ssh handshake smoke test ---"
          ls -la ~/.ssh
          cat ~/.ssh/config
          SSH_OUT="$(ssh -o BatchMode=yes -o ConnectTimeout=15 -T aur@aur.archlinux.org 2>&1)" || true
          echo "$SSH_OUT"
          case "$SSH_OUT" in
            *"Host key verification failed"*)
              echo "error: AUR host key verification failed against pinned keys." >&2
              echo "--- DEBUG: verbose handshake ---" >&2
              ssh -vv -o BatchMode=yes -o ConnectTimeout=15 -T aur@aur.archlinux.org 2>&1 | grep -iE "known_hosts|host key|found key|verify|authenticat|offer|read.*key|bad owner|permission" | head -30 >&2 || true
              echo "--- DEBUG: what this runner actually sees ---" >&2
              ssh -V >&2 || true
              getent ahosts aur.archlinux.org >&2 || echo "(no getent result)" >&2
              ssh-keyscan aur.archlinux.org 2>/dev/null | grep -v "^#" | ssh-keygen -lf - >&2 || echo "(keyscan produced no keys)" >&2
              exit 1
              ;;
          esac
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}

      - name: Push to AUR
        run: |
          export HOME=/root
          git config --global --add safe.directory '*'
          # First release ever: the AUR repo does not exist yet, so clone
          # fails and we initialise it locally instead (first push creates it).
          git clone ssh://aur@aur.archlinux.org/zcc.git aurpush 2>/dev/null || {
            mkdir -p aurpush && git -C aurpush init -b master
          }
          cp aurpkg/PKGBUILD aurpkg/.SRCINFO aurpush/
          git -C aurpush add PKGBUILD .SRCINFO
          if git -C aurpush diff --cached --quiet; then
            echo "AUR already current, skipping push"
            exit 0
          fi
          git -C aurpush -c user.name="zcc-ci" -c user.email="zcc-ci@users.noreply.github.com" \
            commit -m "zcc ${GITHUB_REF#refs/tags/v}"
          git -C aurpush remote get-url origin 2>/dev/null || \
            git -C aurpush remote add origin ssh://aur@aur.archlinux.org/zcc.git
          git -C aurpush push origin HEAD:master
